name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]
      - name: Run tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          python -m cluster_count.generate_synthetic --output artifacts/smoke --num-images 6 --image-size 64 --seed 7

